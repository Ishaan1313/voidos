# Publishes a GitHub release automatically whenever VERSION changes on main.
#
# To ship an update:  edit VERSION (for example 1.0.2), commit, push.
# This creates the tag v1.0.2 and a published release with notes generated from the commits since
# the last release. Installs then see it under Settings > Updates (the updater needs the tag to
# equal the number in VERSION, which this guarantees because the tag is built from VERSION).
#
# It never moves or deletes an existing tag or release. It attaches voidos-<VERSION>.zip to the release.
name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read and validate VERSION
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::VERSION must look like 1.2.0 (got '$VERSION')"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the release zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # An attached zip (not GitHub's automatic source zip) is what installs download: it carries a
          # SHA-256 they verify, and the in-app updater of older versions can only fetch assets.
          git archive --format=zip --prefix="voidos-$VERSION/" -o "voidos-$VERSION.zip" HEAD             -- . ':(exclude)docs' ':(exclude).github'
          ls -l "voidos-$VERSION.zip"

      - name: Create the release (or add the zip to an existing one)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "voidos-$VERSION.zip"; then
              echo "Release $TAG already has its zip; nothing to do."
            else
              gh release upload "$TAG" "voidos-$VERSION.zip"
            fi
          else
            gh release create "$TAG" "voidos-$VERSION.zip"               --target "$GITHUB_SHA"               --title "Void OS $VERSION"               --generate-notes               --latest
          fi
